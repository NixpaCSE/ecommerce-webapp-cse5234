version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - cd bobabox && npm ci
    build:
      commands:
        - cd bobabox && npm run build
  artifacts:
    baseDirectory: bobabox/dist
    files:
      - '**/*'
  cache:
    paths:
      - bobabox/node_modules/**/*
